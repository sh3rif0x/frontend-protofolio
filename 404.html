<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090706;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        
        .error {
            max-width: 600px;
        }
        
        h1 {
            font-size: clamp(80px, 15vw, 180px);
            line-height: 1;
            color: #f3a72d;
        }
        
        h2 {
            font-size: 32px;
            margin: 20px 0 12px;
        }
        
        p {
            color: #aaa;
            margin-bottom: 30px;
        }
        
        a {
            display: inline-block;
            padding: 13px 28px;
            background: #f3a72d;
            color: #090706;
            text-decoration: none;
            font-weight: 600;
            border-radius: 6px;
        }
        
        a:hover {
            opacity: .85;
        }
    </style>
</head>

<body>

    <main class="error">
        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            The page you're looking for doesn't exist or has been moved.
        </p>

        <a href="/">
            Back to Home
        </a>
    </main>

</body>

</html>
